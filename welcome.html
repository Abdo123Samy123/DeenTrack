<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeenTrack | أهلاً بك</title>

    <link rel="stylesheet" href="welcome.css">
</head>

<body>

    <!-- Background -->
    <div class="background">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>

        <div class="grid"></div>

        <div class="particles">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>


    <!-- Main -->
    <main class="welcome-container">

        <section class="welcome-card">

            <div class="logo-area">

                <div class="logo-icon">
                    <span>☪</span>
                </div>

                <h1>Deen<span>Track</span></h1>

                <div class="logo-line"></div>

                <p class="subtitle">
                    نظّم يومك، تابع إنجازك، وطوّر نفسك
                </p>

            </div>


            <div class="welcome-text">

                <span class="small-title">
                    مرحباً بك 👋
                </span>

                <h2>
                    ابدأ رحلتك
                    <strong>اليوم</strong>
                </h2>

                <p>
                    اكتب اسمك علشان نجهز لك لوحة التحكم الخاصة بيك.
                </p>

            </div>


            <!-- Username -->
            <div class="input-area">

                <label for="username">
                    اسم المستخدم
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        id="username"
                        placeholder="اكتب اسمك هنا..."
                        maxlength="20"
                        autocomplete="off"
                    >

                    <span class="input-status">
                        ✦
                    </span>

                </div>

                <small id="inputMessage">
                    الاسم من 2 إلى 20 حرف
                </small>

            </div>


            <!-- Button -->
            <button id="enterButton" class="enter-button">

                <span class="button-text">
                    دخول إلى DeenTrack
                </span>

                <span class="button-icon">
                    ←
                </span>

                <span class="button-shine"></span>

            </button>


            <div class="security-note">
                <span>🔒</span>
                <span>اسمك محفوظ على جهازك فقط</span>
            </div>

        </section>


        <footer>
            <span>DeenTrack</span>
            <b>•</b>
            <span>رحلتك تبدأ من هنا</span>
        </footer>

    </main>


    <script src="welcome.js"></script>

</body>
</html>
